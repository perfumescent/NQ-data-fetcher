name: Data Fetcher Cron

on:
  schedule:
    - cron: "17 * * * *"  # Hourly, away from the top-of-hour scheduling peak

  workflow_dispatch:      # Enable manual trigger from GitHub Actions tab

jobs:
  run-fetcher:
    runs-on: ubuntu-latest
    timeout-minutes: 70   # Bounds the lifetime of the continuous fetcher
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v3
        with:
          version: "latest"
          enable-cache: true

      - name: Set up Python
        run: uv python install 3.13

      - name: Run continuous Data Fetcher
        env:
          REMOTE_API_URL: ${{ secrets.REMOTE_API_URL }}
          PYTHONUNBUFFERED: "1"
        run: |
          uv run --python 3.13 src/main.py

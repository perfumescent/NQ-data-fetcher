[project]
name = "nq-signal-fetcher"
version = "0.1.0"
description = "Data Fetcher and Pusher for NQ-Signal"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "requests>=2.30.0",
    "pandas>=2.0.0",
    "akshare>=1.12.0",
    "lxml>=4.9.0",
    "pydantic>=2.0.0",
    "yfinance>=0.2.0",
    "cachetools>=5.0.0",
    "pydantic-settings>=2.0.0",
    "numpy>=1.20.0",
    "pandas_ta>=0.3.14"
]


[build-system]

requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
